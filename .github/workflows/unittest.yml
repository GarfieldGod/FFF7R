name: System Test
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Run System Test
        run: dotnet run --no-build --verbosity normal
        continue-on-error: true

      - name: Upload test log files
        uses: actions/upload-artifact@v4
        with:
          name: system-test-output
          path: LogOutputDir/*.log

      - name: Mark job failed when test fails
        if: failure()
        run: exit 1
